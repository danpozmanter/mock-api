name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and gossamer build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gossamer/target
          key: ${{ runner.os }}-gossamer-${{ hashFiles('gossamer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gossamer-

      - name: Build and install Gossamer (gos)
        run: |
          git clone --depth=1 https://github.com/danpozmanter/gossamer.git
          cd gossamer
          ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gos check
        run: gos check src/main.gos

      - name: gos test
        run: gos test src/

      - name: gos lint
        run: gos lint src/main.gos
