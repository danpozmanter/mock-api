# Runs the checks, the test suite, and a smoke test of the release binary on
# every push and pull request.
name: Tests

on: [push, pull_request]

env:
  # Keep in step with `gossamer-version` in project.toml and release.yml.
  GOSSAMER_VERSION: v0.64.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Gossamer toolchain (${{ env.GOSSAMER_VERSION }})
        run: |
          curl -fsSL https://raw.githubusercontent.com/gossamer-lang/gossamer/main/scripts/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: gos --version

      - name: gos fmt
        run: gos fmt --check

      - name: gos check
        run: gos check src/main.gos

      - name: gos test
        run: gos test

      - name: gos lint
        run: gos lint

      - name: gos build --release
        run: gos build --release --out-dir dist

      - name: Smoke test the native binary
        run: scripts/smoke.sh dist/mock-api
